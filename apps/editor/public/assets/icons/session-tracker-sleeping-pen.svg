<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 170" aria-hidden="true" focusable="false">
  <style>
    /* Intent: let the app theme recolor the animated pen without replacing the glyph. */
    [fill="#111820"] {
      fill: var(--session-tracker-pen-body, #111820);
    }

    [fill="#F2F2F2"],
    [fill="#f2f2f2"] {
      fill: var(--session-tracker-pen-accent, #f2f2f2);
    }

    [stroke="#F2F2F2"],
    [stroke="#f2f2f2"] {
      stroke: var(--session-tracker-pen-accent, #f2f2f2);
    }

    .floaty {
      transform-origin: 130px 84px;
      animation: sleepyFloat 3.6s ease-in-out infinite;
    }

    .shadow {
      transform-origin: 130px 124px;
      animation: shadowPulse 3.6s ease-in-out infinite;
      opacity: 0.14;
    }

    .zzz1 {
      animation: zDrift1 2.8s ease-in-out infinite;
    }

    .zzz2 {
      animation: zDrift2 3.2s ease-in-out infinite;
    }

    .zzz3 {
      animation: zDrift3 3.6s ease-in-out infinite;
    }

    @keyframes sleepyFloat {
      0%, 100% {
        transform: translateY(0px) rotate(2deg);
      }
      50% {
        transform: translateY(-6px) rotate(3deg);
      }
    }

    @keyframes shadowPulse {
      0%, 100% {
        transform: scaleX(1) scaleY(1);
        opacity: 0.15;
      }
      50% {
        transform: scaleX(0.92) scaleY(0.92);
        opacity: 0.09;
      }
    }

    @keyframes zDrift1 {
      0%   { opacity: 0; transform: translate(0px, 0px) scale(0.82); }
      18%  { opacity: 0.96; }
      72%  { opacity: 0.88; }
      100% { opacity: 0; transform: translate(10px, -20px) scale(1.08); }
    }

    @keyframes zDrift2 {
      0%   { opacity: 0; transform: translate(0px, 0px) scale(0.86); }
      22%  { opacity: 0.92; }
      74%  { opacity: 0.82; }
      100% { opacity: 0; transform: translate(12px, -24px) scale(1.12); }
    }

    @keyframes zDrift3 {
      0%   { opacity: 0; transform: translate(0px, 0px) scale(0.9); }
      26%  { opacity: 0.88; }
      76%  { opacity: 0.76; }
      100% { opacity: 0; transform: translate(13px, -28px) scale(1.16); }
    }

    /* Intent: keep the sleeping cue readable after the pen glyph is scaled into the tracker gauge. */
    text {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 800;
      letter-spacing: 1.5px;
      fill: var(--session-tracker-sleep-z-fill, #f8fbff);
      stroke: var(--session-tracker-sleep-z-outline, rgba(13, 23, 26, 0.88));
      stroke-linejoin: round;
      stroke-width: 4.5px;
      paint-order: stroke fill;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.45));
    }
  </style>

  <ellipse class="shadow" cx="130" cy="126" rx="74" ry="12" fill="black" />

  <g>
    <text class="zzz1" x="72" y="56" font-size="30">z</text>
    <text class="zzz2" x="102" y="45" font-size="36">z</text>
    <text class="zzz3" x="136" y="35" font-size="42">Z</text>
  </g>

  <g class="floaty">
    <g transform="rotate(2 130 84)">
      <rect x="42" y="70" width="68" height="34" rx="15" fill="#111820" />
      <rect x="99" y="74" width="100" height="26" rx="12" fill="#111820" />
      <rect x="100" y="77" width="8" height="20" rx="3" fill="#F2F2F2" />
      <rect x="178" y="77" width="7" height="20" rx="3" fill="#F2F2F2" />

      <path d="M60 76 C78 61, 99 61, 113 74" fill="none" stroke="#F2F2F2" stroke-width="4.5" stroke-linecap="round" />
      <circle cx="111" cy="74" r="3.2" fill="#F2F2F2" />

      <path d="M198 76 L220 76 L230 87 L220 98 L198 98 Z" fill="#111820" />
      <path d="M220 76 L242 87 L220 98 Z" fill="#111820" />
      <path
        d="M227 83 L236 87 L227 91"
        fill="none"
        stroke="#F2F2F2"
        stroke-width="2.1"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="226.5" cy="87" r="2.7" fill="#F2F2F2" />
    </g>
  </g>
</svg>
