<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Abe Sandpit</title>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const rawSandpit = typeof params.get("sandpit") === "string" ? params.get("sandpit").trim() : "";
        const displayName = rawSandpit
          ? rawSandpit.replace(/[-_]+/g, " ").replace(/\b\w/g, (match) => match.toUpperCase())
          : "Manuscript Shell";
        document.title = `Abe Sandpit "${displayName}"`;
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./writing-goals-dashboard.css" />
    <link rel="stylesheet" href="./project-package-dialog.css" />
    <link rel="stylesheet" href="./world-spine-task-layer.css" />
    <script src="./serva-vitae-project-library.js"></script>
    <script src="./serva-vitae-task-group-seed.js"></script>
  </head>
  <body>
    <div id="app" class="app-shell">
      <div class="loading-shell">
        <p class="loading-kicker">Desktop Author Host</p>
        <h1>Loading the local-first workspace...</h1>
        <p>The desktop host is composing manuscript, world, narration, and voice state.</p>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./features/world-spine/world-spine-task-layer.js"></script>
    <script type="module" src="./features/project-lifecycle/project-package-dialog-controller.js"></script>
  </body>
</html>
