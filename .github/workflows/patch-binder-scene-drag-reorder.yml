name: Apply binder drag regression patch

on:
  push:
    branches:
      - fix/binder-scene-drag-reorder

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/binder-scene-drag-reorder
          fetch-depth: 0

      - name: Patch binder drop-target eligibility
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/editor/public/app.js")
          source = path.read_text(encoding="utf-8")

          old_scene = "const scene = getPersistentSceneById(sceneId);"
          new_scene = "const scene = getMovableSceneById(sceneId);"
          old_chapter = "const chapterScenes = getScenesForChapter(chapterId).filter((candidate) => isPersistentScene(candidate));"
          new_chapter = "const chapterScenes = getScenesForChapter(chapterId).filter((candidate) => isMovableScene(candidate));"
          old_comment = "nearest persistent scene boundary"
          new_comment = "nearest movable scene boundary"

          if source.count(old_scene) != 2:
              raise SystemExit(f"Expected exactly two persistent scene drop-target lookups, found {source.count(old_scene)}")
          if source.count(old_chapter) != 1:
              raise SystemExit(f"Expected one persistent chapter drop-target filter, found {source.count(old_chapter)}")
          if source.count(old_comment) != 1:
              raise SystemExit(f"Expected one persistent boundary comment, found {source.count(old_comment)}")

          source = source.replace(old_scene, new_scene)
          source = source.replace(old_chapter, new_chapter)
          source = source.replace(old_comment, new_comment)
          path.write_text(source, encoding="utf-8")

      - name: Add focused regression test
        shell: bash
        run: |
          cat > test/binder-scene-drag-drop-target.test.mjs <<'EOF'
          // Intent: keep binder drop-target resolution compatible with draft and portable scenes that do not carry legacy line numbers.
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import path from "node:path";
          import { fileURLToPath } from "node:url";

          const repoRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
          const appSource = readFileSync(path.join(repoRoot, "apps/editor/public/app.js"), "utf8");

          export function runBinderSceneDragDropTargetTest() {
            const start = appSource.indexOf("function resolveBinderSceneDropTarget(event)");
            const end = appSource.indexOf("\nfunction handleBinderSceneDragStart(event)", start);

            assert.notEqual(start, -1, "Expected binder drop-target resolver to exist.");
            assert.notEqual(end, -1, "Expected binder drag-start handler after drop-target resolver.");

            const resolverSource = appSource.slice(start, end);
            assert.equal(
              (resolverSource.match(/getMovableSceneById\(sceneId\)/g) ?? []).length,
              2,
              "Scene rows and explicit drop slots should resolve any movable scene target.",
            );
            assert.match(
              resolverSource,
              /getScenesForChapter\(chapterId\)\.filter\(\(candidate\) => isMovableScene\(candidate\)\)/,
              "Chapter-body drops should consider all movable scenes.",
            );
            assert.equal(
              /getPersistentSceneById|isPersistentScene/.test(resolverSource),
              false,
              "Drop-target resolution must not require legacy persisted line numbers.",
            );
          }
          EOF

      - name: Verify focused change
        shell: bash
        run: |
          node --check apps/editor/public/app.js
          node --input-type=module -e "import('./test/binder-scene-drag-drop-target.test.mjs').then((m) => m.runBinderSceneDragDropTargetTest())"

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-binder-scene-drag-reorder.yml
          git add apps/editor/public/app.js test/binder-scene-drag-drop-target.test.mjs
          git commit -m "fix(editor): restore binder scene drag targets [skip ci]"
          git push origin HEAD:fix/binder-scene-drag-reorder
