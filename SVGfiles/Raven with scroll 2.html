<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anchor-based Raven Save Icon Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f1720;
      font-family: Arial, sans-serif;
    }

    .preview {
      width: 980px;
      height: 520px;
      display: grid;
      place-items: center;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 12px 36px rgba(0,0,0,0.20);
      overflow: hidden;
    }

    .preview svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="preview">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Anchor-based raven holding a scroll save icon">
  <defs>
    <linearGradient id="bodyGrad" x1="0.15" y1="0.10" x2="0.95" y2="0.92">
      <stop offset="0%" stop-color="#39414f"/>
      <stop offset="42%" stop-color="#171d26"/>
      <stop offset="100%" stop-color="#07090d"/>
    </linearGradient>

    <linearGradient id="wingGradFar" x1="0.12" y1="0.10" x2="0.95" y2="0.85">
      <stop offset="0%" stop-color="#45505f"/>
      <stop offset="45%" stop-color="#1a212b"/>
      <stop offset="100%" stop-color="#06080b"/>
    </linearGradient>

    <linearGradient id="wingGradNear" x1="0.10" y1="0.10" x2="0.85" y2="0.96">
      <stop offset="0%" stop-color="#313946"/>
      <stop offset="45%" stop-color="#141b24"/>
      <stop offset="100%" stop-color="#06080c"/>
    </linearGradient>

    <linearGradient id="tailGrad" x1="0.0" y1="0.0" x2="1.0" y2="1.0">
      <stop offset="0%" stop-color="#242a33"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dac18f"/>
      <stop offset="100%" stop-color="#9f7c43"/>
    </linearGradient>

    <linearGradient id="scrollGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf0d6"/>
      <stop offset="100%" stop-color="#ddc896"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="bodyShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <style>
    /* Shared anchor roots keep everything tied together */
    .raven {
      transform-origin: 500px 240px;
      animation: hover 2.8s ease-in-out infinite;
    }

    .farWing {
      transform-origin: 518px 166px;
      animation: flapFar 1.15s ease-in-out infinite;
    }

    .nearWing {
      transform-origin: 334px 232px;
      animation: flapNear 1.15s ease-in-out infinite;
    }

    .scrollGroup {
      transform-origin: 568px 323px;
      animation: scrollSwing 2.8s ease-in-out infinite;
    }

    .groundShadow {
      transform-origin: 555px 396px;
      animation: shadowPulse 2.8s ease-in-out infinite;
      opacity: 0.12;
    }

    @keyframes hover {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-4px); }
    }

    @keyframes flapFar {
      0%, 100% { transform: rotate(-4deg) translateY(0px); }
      50%      { transform: rotate(-11deg) translateY(-5px); }
    }

    @keyframes flapNear {
      0%, 100% { transform: rotate(7deg) translateY(0px); }
      50%      { transform: rotate(15deg) translateY(5px); }
    }

    @keyframes scrollSwing {
      0%, 100% { transform: rotate(0deg) translateY(0px); }
      50%      { transform: rotate(1.8deg) translateY(2px); }
    }

    @keyframes shadowPulse {
      0%, 100% { transform: scaleX(1); opacity: 0.12; }
      50%      { transform: scaleX(0.92); opacity: 0.07; }
    }
  </style>

    <g class="scrollGroup">
      
  <g id="claws" stroke="#967536" stroke-width="6" stroke-linecap="round" fill="none">

</svg>
