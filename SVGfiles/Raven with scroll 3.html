<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Detailed Raven Save Icon Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f1720;
      font-family: Arial, sans-serif;
    }

    .preview {
      width: 980px;
      height: 520px;
      display: grid;
      place-items: center;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 12px 36px rgba(0,0,0,0.22);
      overflow: hidden;
    }

    .preview svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>

  <div class="preview">

      <stop offset="72%" stop-color="#0d1118"/>
      <stop offset="100%" stop-color="#05070b"/>

    <linearGradient id="headGrad" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#394250"/>
      <stop offset="52%" stop-color="#151b24"/>
      <stop offset="100%" stop-color="#06080c"/>
    </linearGradient>
    <linearGradient id="wingGradFar" x1="0.12" y1="0.06" x2="0.95" y2="0.9">
      <stop offset="0%" stop-color="#536071"/>
      <stop offset="30%" stop-color="#303947"/>
      <stop offset="65%" stop-color="#151b24"/>
      <stop offset="100%" stop-color="#06080c"/>
    </linearGradient>
    <linearGradient id="wingGradNear" x1="0.12" y1="0.05" x2="0.85" y2="0.96">

      <stop offset="35%" stop-color="#202835"/>
      <stop offset="72%" stop-color="#0d1219"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="tailGrad" x1="0.0" y1="0.0" x2="1.0" y2="1.0">
      <stop offset="0%" stop-color="#2b323d"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dec690"/>
      <stop offset="100%" stop-color="#987742"/>
    </linearGradient>
    <linearGradient id="scrollGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf0d6"/>
      <stop offset="100%" stop-color="#ddc896"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="bodyShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <style>
    .raven { transform-origin: 500px 240px; animation: hover 2.8s ease-in-out infinite; }
    .farWing { transform-origin: 518px 166px; animation: flapFar 1.15s ease-in-out infinite; }
    .nearWing { transform-origin: 334px 232px; animation: flapNear 1.15s ease-in-out infinite; }
    .scrollGroup { transform-origin: 568px 323px; animation: scrollSwing 2.8s ease-in-out infinite; }
    .groundShadow { transform-origin: 555px 396px; animation: shadowPulse 2.8s ease-in-out infinite; opacity: 0.12; }
    .featherLine { fill: none; stroke: #647083; stroke-width: 2.2; stroke-linecap: round; opacity: 0.28; }
    .featherLineDark { fill: none; stroke: #05070a; stroke-width: 2.1; stroke-linecap: round; opacity: 0.36; }
    .fineFeather { fill: none; stroke: #8792a4; stroke-width: 1.25; stroke-linecap: round; opacity: 0.20; }
    .bodySpeckle { fill: #6f7b8b; opacity: 0.16; }
    @keyframes hover { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    @keyframes flapFar { 0%, 100% { transform: rotate(-3.5deg) translateY(0px); } 50% { transform: rotate(-9deg) translateY(-4px); } }
    @keyframes flapNear { 0%, 100% { transform: rotate(6deg) translateY(0px); } 50% { transform: rotate(12deg) translateY(4px); } }
    @keyframes scrollSwing { 0%, 100% { transform: rotate(0deg) translateY(0px); } 50% { transform: rotate(1.5deg) translateY(2px); } }
    @keyframes shadowPulse { 0%, 100% { transform: scaleX(1); opacity: 0.12; } 50% { transform: scaleX(0.92); opacity: 0.07; } }
  </style>
