      place-items: center;

      font-family: Arial, sans-serif;
    }

    .preview {
      width: 980px;
      height: 520px;
      display: grid;
      place-items: center;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 12px 36px rgba(0,0,0,0.22);
      overflow: hidden;
    }

    .preview svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>

  <style>
    .raven { transform-origin: 500px 240px; animation: hover 3.2s ease-in-out infinite; }
    .farWing { transform-origin: 528px 170px; animation: flapFar 1.4s ease-in-out infinite; }
    .nearWing { transform-origin: 332px 236px; animation: flapNear 1.4s ease-in-out infinite; }
    .scrollGroup { transform-origin: 572px 328px; animation: scrollSwing 3.2s ease-in-out infinite; }
    .groundShadow { transform-origin: 555px 402px; animation: shadowPulse 3.2s ease-in-out infinite; opacity: 0.10; }
    .ridge { fill: none; stroke: #7f8ca1; stroke-width: 1.7; stroke-linecap: round; opacity: 0.16; }
    .groove { fill: none; stroke: #05070b; stroke-width: 1.6; stroke-linecap: round; opacity: 0.26; }
    .fineGlow { fill: none; stroke: #aab4c8; stroke-width: 1.1; stroke-linecap: round; opacity: 0.12; }
    .goldLine { fill: none; stroke: #d0b37c; stroke-width: 1.5; stroke-linecap: round; opacity: 0.55; }

    @keyframes hover {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    @keyframes flapFar {
      0%, 100% { transform: rotate(-2.2deg) translateY(0px); }
      50% { transform: rotate(-5.8deg) translateY(-2px); }
    }
    @keyframes flapNear {
      0%, 100% { transform: rotate(3.8deg) translateY(0px); }
      50% { transform: rotate(7.8deg) translateY(2px); }
    }
    @keyframes scrollSwing {
      0%, 100% { transform: rotate(0deg) translateY(0px); }
      50% { transform: rotate(0.8deg) translateY(1.2px); }
    }
    @keyframes shadowPulse {
      0%, 100% { transform: scaleX(1); opacity: 0.10; }
      50% { transform: scaleX(0.95); opacity: 0.06; }
    }
  </style>
